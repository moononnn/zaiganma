name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0
          pip install httpx mss Pillow PyQt6
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: npm test
      - name: 命名红线检查
        run: |
          if git grep -n -I -E "玥儿|绯月|雪奈|悠米|柚月|星眠" -- .; then
            echo "::error::外传内容命名红线命中（玥儿/绯月/雪奈/悠米/柚月/星眠），请清理后重新提交"
            exit 1
          fi
          echo "命名红线检查通过 ✓"
